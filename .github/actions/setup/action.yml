name: Setup
description: Install pnpm from packageManager, Node.js 22, and the frozen lockfile.

inputs:
  registry-url:
    description: npm registry written into .npmrc when publishing.
    required: false
    default: ""
  cache:
    description: Cache the pnpm store. Publish leaves this off.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        cache: ${{ inputs.cache == 'true' }}
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
