name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zstd and sqlite3 for the archive reader and Devin provider tests
        run: sudo apt-get update && sudo apt-get install -y zstd sqlite3
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  reportFailure:
    name: Open issue on main failure
    needs:
      - check
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
