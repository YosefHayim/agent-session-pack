name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      since: ${{ steps.filter.outputs.everything != 'true' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ''
          filters: |
            everything:
              - pnpm-lock.yaml
              - package.json
              - biome.json
              - 'tsconfig*.json'
              - '*.config.ts'
              - '.github/**'

  biome:
    name: Biome
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every file
        if: needs.changes.outputs.since == ''
        run: pnpm exec biome ci .
      - name: Lint the changed files
        if: needs.changes.outputs.since != ''
        run: pnpm exec biome ci --changed --since="$SINCE" --no-errors-on-unmatched
        env:
          SINCE: ${{ needs.changes.outputs.since }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # archiveReader + devinProvider tests need system binaries
      - run: sudo apt-get update && sudo apt-get install -y zstd sqlite3
      - run: pnpm install --frozen-lockfile
      - name: Test everything
        if: needs.changes.outputs.since == ''
        run: pnpm test
      - name: Test what the changes touch
        if: needs.changes.outputs.since != ''
        run: pnpm exec vitest run --changed "$SINCE"
        env:
          SINCE: ${{ needs.changes.outputs.since }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  ciGate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, biome, typecheck, test, build]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.biome.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.test.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build.result }}" != "success" ]; then exit 1; fi

  reportFailure:
    needs: [ciGate]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/reportFailure.yml
