name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
          cache: false
      # Node 22 ships npm 10. Trusted publishing needs npm 11.5.1 or newer.
      - name: Install npm 11
        run: npm install --global npm@11.21.2
      - name: Build
        run: pnpm build
      - name: Publish
        run: npm publish --provenance --access public
