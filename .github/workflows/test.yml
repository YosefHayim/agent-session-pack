name: Test
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y zstd sqlite3
      - run: pnpm test
    timeout-minutes: 20
